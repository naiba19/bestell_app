<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell App</title>

    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/assets.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/basket.css">
</head>

<body>
    <header class="header">
        <div class="header-content">
            <img src="./assets/icons/logo_2.svg" alt="Food ordering app logo" class="header-logo">
            <button class="menu-button" type="button" aria-label="Open menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>
    </header>

    <section class="hero">
        <img src="./assets/images/hero.jpg" alt="Burgers, pizza and other dishes" class="hero-image">
    </section>

    <section class="restaurant-info">
        <img src="./assets/icons/logo_burger.png" alt="BurgerHouse" class="burger-image">

        <div class="restaurant-title">
            <img src="./assets/icons/burger_house.png"
            alt="BurgerHouse"
            class="restaurant-name">

            <img src="./assets/icons/rating.png" alt="Rating 4,1 from 317 reviews" class="restaurant-rating">
        </div>
        <p class="restaurant-description">
            The best of Burgers, Pizza, and Greens, all in one great place.
        </p>
    </section>

</body>

</html>
